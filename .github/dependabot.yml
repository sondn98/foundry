# Keeps the SHA-pinned actions in .github/workflows fresh.
#
# Every third-party action is pinned to a full commit SHA with a `# vX.Y.Z`
# comment. Dependabot understands that convention: it bumps both the SHA and
# the comment, so pinning does not mean going stale.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions
